image: atlassian/default-image:4

pipelines:
  pull-requests:
    '**':
      - step:
          name: Claude PR Review
          script:
            - 'curl -s -o diff.txt -w "DIFF_HTTP_STATUS:%{http_code}\n" -H "Authorization: Bearer $BB_ACCESS_TOKEN" "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_WORKSPACE/$BITBUCKET_REPO_SLUG/pullrequests/$BITBUCKET_PR_ID/diff"'
            - echo  | base64 -d > review.py
            - python3 review.py