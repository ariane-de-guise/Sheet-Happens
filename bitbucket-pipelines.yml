image: node:20

pipelines:
  pull-requests:
    '**':
      - step:
          name: Claude PR Review
          script:
            - unset ANTHROPIC_API_KEY
            - 'curl -s -L -o diff.txt -w "DIFF_HTTP_STATUS:%{http_code}\n" -H "Authorization: Bearer $BB_ACCESS_TOKEN" "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_WORKSPACE/$BITBUCKET_REPO_SLUG/pullrequests/$BITBUCKET_PR_ID/diff"'
            - npm install -g @anthropic-ai/claude-code
            - claude -p --allowedTools "" "Review the pull request diff piped in below. Point out bugs, risks, and concrete improvements. Be concise. Do not explore the repository, only use the diff text provided." < diff.txt > review.txt
            - cat review.txt
            - echo  | base64 -d > post_comment.py
            - python3 post_comment.py